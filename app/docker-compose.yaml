services:
  mysql:
    container_name: mysql
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: toor
      MYSQL_DATABASE: django
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ptoor --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "3306:3306"

  django:
    container_name: django
    build:
      context: .
      dockerfile: Dockerfile
    image: django:latest
    env_file:
      - .env
    volumes:
      - static:/app/static
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    container_name: nginx
    image: nginx:latest
    volumes:
      - /home/ubuntu/pydjango/app/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static:/usr/share/nginx/html
    depends_on:
      - django
    ports:
      - "80:80"


volumes:
  static:
