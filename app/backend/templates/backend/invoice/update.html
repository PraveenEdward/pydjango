{% extends 'backend/base.html' %}

{% block content %}

<div class="content-wrapper">

    <section class="content-header">

        <h1>
            Update Invoice
        </h1>

    </section>

    <section class="content">

        <form method="POST">

            {% csrf_token %}

            <div class="row">

                <div class="col-md-12">

                    <div class="box box-primary">

                        <div class="box-header">

                            <h3 class="box-title">
                                Invoice Details
                            </h3>

                        </div>

                        <div class="box-body">

                            <div class="row">

                                <div class="col-md-4">

                                    <label>Customer Name</label>

                                    <input type="text"
                                           name="customer_name"
                                           class="form-control"
                                           value="{{ invoice.customer_name }}">

                                </div>

                                <div class="col-md-4">

                                    <label>Mobile</label>

                                    <input type="text"
                                           name="customer_mobile"
                                           class="form-control"
                                           value="{{ invoice.customer_mobile }}">

                                </div>

                                <div class="col-md-4">

                                    <label>Payment Method</label>

                                    <select name="payment_method"
                                            class="form-control">

                                        <option value="Cash"
                                        {% if invoice.payment_method == 'Cash' %}
                                        selected
                                        {% endif %}>
                                            Cash
                                        </option>

                                        <option value="UPI"
                                        {% if invoice.payment_method == 'UPI' %}
                                        selected
                                        {% endif %}>
                                            UPI
                                        </option>

                                        <option value="Card"
                                        {% if invoice.payment_method == 'Card' %}
                                        selected
                                        {% endif %}>
                                            Card
                                        </option>

                                    </select>

                                </div>

                            </div>

                            <br>

                            <table class="table table-bordered"
                                   id="productTable">

                                <thead>

                                    <tr>

                                        <th>Product</th>
                                        <th width="120">Price</th>
                                        <th width="100">Qty</th>
                                        <th width="150">Subtotal</th>
                                        <th width="100">Action</th>

                                    </tr>

                                </thead>

                                <tbody>

                                    {% for item in invoice.items.all %}

                                    <tr>

                                        <td>

                                            <select name="product[]"
                                                    class="form-control product-select">

                                                {% for product in products %}

                                                <option value="{{ product.id }}"
                                                        data-price="{{ product.selling_price }}"
                                                        {% if product.id == item.product.id %}
                                                        selected
                                                        {% endif %}>

                                                    {{ product.product_name }}

                                                </option>

                                                {% endfor %}

                                            </select>

                                        </td>

                                        <td>

                                            <input type="text"
                                                   class="form-control price"
                                                   value="{{ item.price }}"
                                                   readonly>

                                        </td>

                                        <td>

                                            <input type="number"
                                                   name="qty[]"
                                                   class="form-control qty"
                                                   value="{{ item.quantity }}"
                                                   min="1">

                                        </td>

                                        <td>

                                            <input type="text"
                                                   class="form-control subtotal"
                                                   value="{{ item.subtotal }}"
                                                   readonly>

                                        </td>

                                        <td>

                                            <button type="button"
                                                    class="btn btn-danger removeRow">

                                                Delete

                                            </button>

                                        </td>

                                    </tr>

                                    {% endfor %}

                                </tbody>

                            </table>

                            <button type="button"
                                    id="addRow"
                                    class="btn btn-success">

                                <i class="fa fa-plus"></i>
                                Add Product

                            </button>

                            <hr>

                            <div class="row">

                                <div class="col-md-4 col-md-offset-8">

                                    <label>Total Amount</label>

                                    <input type="text"
                                           id="totalAmount"
                                           class="form-control"
                                           readonly>

                                    <br>

                                    <label>Discount</label>

                                    <input type="number"
                                           name="discount_amount"
                                           id="discount"
                                           value="{{ invoice.discount_amount }}"
                                           class="form-control">

                                    <br>

                                    <label>Grand Total</label>

                                    <input type="text"
                                           id="grandTotal"
                                           class="form-control"
                                           readonly>

                                </div>

                            </div>

                        </div>

                        <div class="box-footer">

                            <button type="submit"
                                    class="btn btn-primary">

                                Update Invoice

                            </button>

                            <a href="{% url 'invoice_list' %}"
                               class="btn btn-default">

                                Cancel

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </form>

    </section>

</div>

{% endblock %}

{% block scripts %}

<script>

$(document).ready(function(){

    calculateTotals();

    $('#addRow').click(function(){

        var row = `
        <tr>

            <td>

                <select name="product[]"
                        class="form-control product-select">

                    {% for product in products %}

                    <option value="{{ product.id }}"
                            data-price="{{ product.selling_price }}">

                        {{ product.product_name }}

                    </option>

                    {% endfor %}

                </select>

            </td>

            <td>

                <input type="text"
                       class="form-control price"
                       value="0"
                       readonly>

            </td>

            <td>

                <input type="number"
                       name="qty[]"
                       class="form-control qty"
                       value="1">

            </td>

            <td>

                <input type="text"
                       class="form-control subtotal"
                       value="0"
                       readonly>

            </td>

            <td>

                <button type="button"
                        class="btn btn-danger removeRow">

                    Delete

                </button>

            </td>

        </tr>
        `;

        $('#productTable tbody').append(row);

    });

    $(document).on(
        'click',
        '.removeRow',
        function(){

            $(this).closest('tr').remove();

            calculateTotals();

        }
    );

    $(document).on(
        'change',
        '.product-select',
        function(){

            var price = $(this)
                .find(':selected')
                .data('price');

            $(this)
                .closest('tr')
                .find('.price')
                .val(price);

            calculateTotals();

        }
    );

    $(document).on(
        'keyup change',
        '.qty,#discount',
        function(){

            calculateTotals();

        }
    );

    function calculateTotals(){

        var total = 0;

        $('#productTable tbody tr').each(function(){

            var price = parseFloat(
                $(this).find('.price').val()
            ) || 0;

            var qty = parseInt(
                $(this).find('.qty').val()
            ) || 0;

            var subtotal = price * qty;

            $(this)
                .find('.subtotal')
                .val(subtotal.toFixed(2));

            total += subtotal;

        });

        $('#totalAmount').val(
            total.toFixed(2)
        );

        var discount = parseFloat(
            $('#discount').val()
        ) || 0;

        $('#grandTotal').val(
            (total - discount).toFixed(2)
        );
    }

});

</script>

{% endblock %}
